name: 'Test Coverage on Drupal 11.4.x + PHP 8.5'

on:
  push:
    branches:
      - '4.x'
  pull_request:
    types: ['opened', 'synchronize']
  workflow_dispatch:

permissions: read-all

jobs:
  run-tests:
    runs-on: 'ubuntu-latest'
    name: 'Test Coverage'

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v6'
      - name: 'Run Automated testing + report coverage'
        uses: 'tripal/test-tripal-action@v1.9'
        with:
          directory-name: 'tripal_analysis_blast'
          modules: ''
          build-image: TRUE
          dockerfile: 'Dockerfile'
          php-version: 8.5
          pgsql-version: 18
          drupal-version: 11.4.x
          qltycloud-reporter-id: ${{ secrets.QLTY_COVERAGE_TOKEN }}
