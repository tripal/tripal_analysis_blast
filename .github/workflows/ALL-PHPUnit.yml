
name: PHPUnit Full Test Suite
on:
  push:
    branches-ignore:
      - 4.x
  # Allows us to manually trigger this workflow.
  workflow_dispatch:

env:
  PKG_NAME: 'Tripal Analysis Blast'
  MODULES: 'tripal_analysis_blast'

jobs:
  run-tests:
    name: 'Drupal ${{ matrix.drupal-version }} - PHP ${{ matrix.php-version }} - PostgreSQL ${{ matrix.pgsql-version }}'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.3'
          - '8.4'
          - '8.5'
        pgsql-version:
          - '16'
          - '18'
        drupal-version:
          - '11.3.x'
          - '11.4.x'
          - '11.x-dev'
        exclude:
          # Drupal 11.x is the bleeding edge so only run it on the latest php.
          - php-version: '8.3'
            drupal-version: '11.x-dev'
          - php-version: '8.4'
            drupal-version: '11.x-dev'
          # Drupal 11.x is the bleeding edge so only run it on the latest postgreSQL.
          - php-version: '8.4'
            pgsql-version: '16'
            drupal-version: '11.x-dev'
          - php-version: '8.5'
            pgsql-version: '16'
            drupal-version: '11.x-dev'

    steps:
      # Check out the repo
      - name: Checkout Repository
        uses: actions/checkout@v6
      # Here we pull the development tripaldocker image for this combo in our matrix
      - name: Run Automated testing
        uses: tripal/test-tripal-action@v1.9
        with:
          directory-name: $PKG_NAME
          modules: $MODULES
          build-image: TRUE
          dockerfile: 'Dockerfile'
          php-version: ${{ matrix.php-version }}
          pgsql-version: ${{ matrix.pgsql-version }}
          drupal-version: ${{ matrix.drupal-version }}
