
name: 'PHPUnit 8.4 11.3 18'

on:
  workflow_dispatch:
  push:
    branches:
      - '4.x'
  schedule:
    - cron: '53 6 * * *'

permissions: read-all


jobs:
  running-tests:
    name: 'PHP 8.4 - Drupal 11.3.x - PostgreSQL 18'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v7'
      - name: 'Run Automated testing'
        uses: 'tripal/test-tripal-action@v1.9'
        with:
          directory-name: 'tripal_analysis_blast'
          modules: 'tripal, tripal_biodb, tripal_chado, tripal_layout, tripal_search_views, tripal_analysis_blast'
          php-version: '8.4'
          drupal-version: '11.3.x'
          pgsql-version: '18'
          build-image: TRUE
          dockerfile: 'Dockerfile'
