
name: 'PHPUnit 8.5 11.4 18'

on:
  workflow_dispatch:
  push:
    branches:
      - '4.x'
  schedule:
    - cron: '52 6 * * *'

permissions: read-all


jobs:
  running-tests:
    name: 'PHP 8.5 - Drupal 11.4.x - PostgreSQL 18'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v7'
      - name: 'Run Automated testing'
        uses: 'tripal/test-tripal-action@v1.9'
        with:
          directory-name: 'tripal'
          modules: 'tripal_analysis_blast'
          php-version: '8.5'
          drupal-version: '11.4.x'
          pgsql-version: '18'
          build-image: TRUE
          dockerfile: 'Dockerfile'
