id: 'tripal_analysis_blast_content_terms'
label: 'Tripal Analysis Blast Terms'
description: 'Terms used by the Tripal Analysis Blast module'
dependencies:
    module:
        - 'tripal_analysis_blast'
    enforced:
        module:
            - 'tripal_analysis_blast'
vocabularies:
    -   name: 'local'
        label: 'Locally created terms'
        url: 'cv/lookup/local'
        idSpaces:
            -   name: 'local'
                description: 'Terms created for this site'
                urlPrefix: 'cv/lookup/{db}/{accession}'
        terms:
            -   id: 'local:analysis_blast_settings'
                name: 'analysis_blast_settings'
                description: 'Settings of a blast analysis, including db_id, output file, and run parameters separated by a bar |'
            -   id: 'local:analysis_blast_blastdb'
                name: 'analysis_blast_blastdb'
                description: 'The database used for blasting'
            -   id: 'local:analysis_blast_blastfile'
                name: 'analysis_blast_blastfile'
                description: 'The input file or directory that contains the XML blast output'
            -   id: 'local:analysis_blast_blastparameters'
                name: 'analysis_blast_blastparameters'
                description: 'The parameters used when performing blast.'
            -   id: 'local:analysis_blast_no_parsed'
                name: 'analysis_blast_no_parsed'
                description: 'Indicates if the input file should be parsed to map results to features'
            -   id: 'local:analysis_blast_query_re'
                name: 'analysis_blast_query_re'
                description: 'The regular expression for finding the feature name in the query definition line of the blast results'
            -   id: 'local:analysis_blast_query_type'
                name: 'analysis_blast_query_type'
                description: 'The feature type (e.g. mRNA, polypeptide) of the query input file. This type is used to identify the query feature when multiple features have the same name'
            -   id: 'local:analysis_blast_query_uniquename'
                name: 'analysis_blast_query_uniquename'
                description: 'Indicates if the matched name in the query definition line of the blast results is feature uniquename'
            -   id: 'local:analysis_blast_blastfile_ext'
                name: 'analysis_blast_blastfile_ext'
                description: 'Indicates the extension of the blast files. This is required if the blastfile setting is a directory.'
            -   id: 'local:analysis_blast_is_concat'
                name: 'analysis_blast_is_concat'
                description: 'Indicates if the blast results XML file is a series of concatenated XML results.  Such is the case, for example, if Blast2GO was used to perform the analysis.'
            -   id: 'local:analysis_blast_search_keywords'
                name: 'analysis_blast_search_keywords'
                description: 'Indicates the fields that should be stored in the analysisfeatureprop table for the blast results.'
            -   id: 'local:blast_match_name'
                name: 'blast_match_name'
                description: 'The blast match name'
            -   id: 'local:blast_match_description'
                name: 'blast_match_description'
                description: 'The match description'
            -   id: 'local:blast_match_organism'
                name: 'blast_match_organism'
                description: 'The organism the blast match belongs to'
            -   id: 'local:blast_match_accession'
                name: 'blast_match_accession'
                description: 'The accession of the blast match'
            -   id: 'local:blast_database'
                name: 'blast_database'
                description: 'The name of the database blasted against'
            -   id: 'local:blast_evalue'
                name: 'blast_evalue'
                description: 'The blast match e-valuue score (best e-value if multiple HSPs)'
            -   id: 'local:blast_score'
                name: 'blast_score'
                description: 'The blast hit match bit score'
            -   id: 'local:blast_pid'
                name: 'blast_pid'
                description: 'The blast hit match percent identity'
            -   id: 'local:analysis_blast_output_iteration_hits'
                name: 'analysis_blast_output_iteration_hits'
                description: 'Hits of a blast'
            -   id: 'local:analysis_blast_besthit_query'
                name: 'analysis_blast_besthit_query'
                description: 'query name of the best hit associated with a feature and a blast analysis'
            -   id: 'local:analysis_blast_besthit_match'
                name: 'analysis_blast_besthit_match'
                description: 'match name of the best hit associated with a feature and a blast analysis'
            -   id: 'local:analysis_blast_besthit_description'
                name: 'analysis_blast_besthit_description'
                description: 'description of the best hit associated with a feature and a blast analysis'
            -   id: 'local:analysis_blast_besthit_evalue'
                name: 'analysis_blast_besthit_evalue'
                description: 'evalue of the best hit associated with a feature and a blast analysis'
            -   id: 'local:analysis_blast_besthit_identity'
                name: 'analysis_blast_besthit_identity'
                description: 'identity (%) of the best hit associated with a feature and a blast analysis'
            -   id: 'local:analysis_blast_besthit_length'
                name: 'analysis_blast_besthit_length'
                description: 'length of the best hit associated with a feature and a blast analysis'
