system-under-test:
  comment: 'no specialized testing environment needed'
scenarios:
  - label: 'Unaltered call to TripalAnalysisBlast Rebuild service'
    expected_modules:
      - 'tripal'
      - 'tripal_chado'
      - 'tripal_analysis_blast'
    expected_config_entities:
      - module: 'tripal'
        type: 'tripal_content_terms'
        name: 'tripal_analysis_blast_content_terms'
    expected_drupal_tables:
      - name: 'tripal_analysis_blast'
    expected_chado_tables:
      - name: 'blast_organisms'
        before:
          exists: false
        after:
          exists: true
          columns:
            blast_org_name: true
            blast_org_id: true
      - name: 'blast_hit_data'
        before:
          exists: false
        after:
          exists: true
          columns:
            analysisfeature_id: true
            analysis_id: true
            feature_id: true
            db_id: true
            hit_num: true
            hit_name: true
            hit_url: true
            hit_description: true
            hit_organism: true
            blast_org_id: true
            hit_accession: true
            hit_best_eval: true
            hit_best_score: true
            hit_pid: true
